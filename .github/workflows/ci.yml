name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: build-and-test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out Breakout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: breakout
          persist-credentials: false
      - name: Read pinned kit revision
        id: kit
        shell: pwsh
        run: |
          $revision = (Get-Content breakout/.github/crushkit-revision -Raw).Trim()
          if ($revision -notmatch '^[0-9a-f]{40}$') { throw 'Expected a full kit commit SHA.' }
          "revision=$revision" >> $env:GITHUB_OUTPUT
      - name: Check out compatible CrushKit source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: aefreedman/crushkit-brutal
          ref: ${{ steps.kit.outputs.revision }}
          path: crushkit-brutal
          persist-credentials: false
      - name: Set up pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: breakout/global.json
      - name: Build and run headless source tests
        shell: pwsh
        run: ./breakout/.github/scripts/ci.ps1 -CrushKitRoot "${{ github.workspace }}/crushkit-brutal"
